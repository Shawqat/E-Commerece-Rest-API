<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متجرنا الإلكتروني</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        primaryDark: '#7C3AED',
                        secondary: '#EC4899',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts: Cairo (Arabic) + Inter (English fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="bg-white shadow-md sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <!-- Logo -->
                <a href="#" id="navLogo" class="flex items-center gap-2 text-2xl font-extrabold text-primary tracking-tight">
                    <i class="fas fa-store text-primary"></i>
                    <span>متجرنا</span>
                </a>

                <!-- Desktop Nav -->
                <div class="hidden md:flex items-center gap-6">
                    <button id="navHome" class="text-gray-700 hover:text-primary font-semibold transition">الرئيسية</button>
                    <button id="navProducts" class="text-gray-700 hover:text-primary font-semibold transition">المنتجات</button>
                    <button id="navAdmin" class="text-gray-700 hover:text-primary font-semibold transition hidden">لوحة التحكم</button>
                </div>

                <!-- Auth & User -->
                <div class="flex items-center gap-3">
                    <!-- User greeting (hidden when logged out) -->
                    <span id="userGreeting" class="hidden text-sm font-semibold text-gray-700 ml-2"></span>

                    <!-- Auth buttons -->
                    <button id="btnLogin" class="text-sm font-semibold text-primary border-2 border-primary px-4 py-1.5 rounded-full hover:bg-primary hover:text-white transition">دخول</button>
                    <button id="btnSignup" class="text-sm font-semibold bg-primary text-white px-4 py-1.5 rounded-full hover:bg-primaryDark transition">اشتراك</button>

                    <!-- Logout -->
                    <button id="btnLogout" class="hidden text-sm font-semibold text-red-500 hover:text-red-700 transition">
                        <i class="fas fa-sign-out-alt"></i> خروج
                    </button>

                    <!-- Mobile menu toggle -->
                    <button id="mobileMenuToggle" class="md:hidden text-gray-700 text-xl">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Nav (collapsible) -->
            <div id="mobileMenu" class="md:hidden hidden pb-4 space-y-2 border-t border-gray-100 pt-3">
                <button class="block w-full text-right px-2 py-2 text-gray-700 hover:text-primary font-semibold" data-view="home">الرئيسية</button>
                <button class="block w-full text-right px-2 py-2 text-gray-700 hover:text-primary font-semibold" data-view="products">المنتجات</button>
                <button id="mobileAdminLink" class="block w-full text-right px-2 py-2 text-gray-700 hover:text-primary font-semibold hidden" data-view="admin">لوحة التحكم</button>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- ========== VIEW: HOME ========== -->
        <section id="viewHome" class="view-section active fade-in">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800">مرحباً بكم في <span class="text-primary">متجرنا</span></h1>
                <p class="text-gray-500 mt-2 text-lg">أفضل المنتجات بأفضل الأسعار</p>
            </div>

            <!-- Featured products quick preview -->
            <div id="homeProductGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Rendered by JS -->
            </div>
            <div class="text-center mt-8">
                <button id="homeViewAllBtn" class="bg-primary text-white px-8 py-2.5 rounded-full font-semibold hover:bg-primaryDark transition">عرض كل المنتجات</button>
            </div>
        </section>

        <!-- ========== VIEW: PRODUCTS ========== -->
        <section id="viewProducts" class="view-section fade-in">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                <h2 class="text-2xl font-bold text-gray-800">جميع المنتجات</h2>

                <!-- Filter & Sort Bar -->
                <div class="flex flex-wrap items-center gap-3">
                    <input id="searchInput" type="text" placeholder="بحث عن منتج..." class="border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent w-48 sm:w-56" />

                    <select id="sortSelect" class="border border-gray-300 rounded-full px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                        <option value="-createdAt">الأحدث</option>
                        <option value="price">السعر: من الأقل</option>
                        <option value="-price">السعر: من الأعلى</option>
                        <option value="name">الاسم: أ-ي</option>
                    </select>

                    <select id="categoryFilter" class="border border-gray-300 rounded-full px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                        <option value="">كل الأقسام</option>
                        <!-- populated by JS -->
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Rendered by JS -->
            </div>

            <!-- Pagination -->
            <div class="flex items-center justify-between mt-8 border-t border-gray-200 pt-6">
                <div class="text-sm text-gray-500" id="paginationInfo">عرض 0 منتج</div>
                <div class="flex gap-2" id="paginationButtons">
                    <!-- rendered by JS -->
                </div>
            </div>
        </section>

        <!-- ========== VIEW: PRODUCT DETAIL ========== -->
        <section id="viewProductDetail" class="view-section fade-in">
            <button id="backToProducts" class="flex items-center gap-2 text-gray-600 hover:text-primary font-semibold mb-6">
                <i class="fas fa-arrow-right"></i> العودة للمنتجات
            </button>
            <div id="productDetailContainer" class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
                <!-- Rendered by JS -->
            </div>
        </section>

        <!-- ========== VIEW: ADMIN DASHBOARD ========== -->
        <section id="viewAdmin" class="view-section fade-in">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                <h2 class="text-2xl font-bold text-gray-800"><i class="fas fa-crown text-primary mr-2"></i> لوحة التحكم</h2>
                <button id="adminOpenCreate" class="bg-primary text-white px-6 py-2 rounded-full font-semibold hover:bg-primaryDark transition">
                    <i class="fas fa-plus mr-1"></i> إضافة منتج
                </button>
            </div>

            <!-- Admin Product Table -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-right">
                        <thead class="bg-gray-50 text-gray-600 font-semibold border-b border-gray-200">
                            <tr>
                                <th class="px-5 py-3">المنتج</th>
                                <th class="px-5 py-3">السعر</th>
                                <th class="px-5 py-3">المخزون</th>
                                <th class="px-5 py-3">القسم</th>
                                <th class="px-5 py-3 text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- Rendered by JS -->
                        </tbody>
                    </table>
                </div>
                <div id="adminEmpty" class="hidden text-center py-12 text-gray-400">
                    <i class="fas fa-box-open text-4xl mb-3"></i>
                    <p>لا توجد منتجات بعد</p>
                </div>
            </div>
        </section>

        <!-- ========== VIEW: LOGIN ========== -->
        <section id="viewLogin" class="view-section fade-in">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">تسجيل الدخول</h2>
                <p class="text-center text-gray-500 text-sm mb-6">أهلاً بك مجدداً</p>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="loginEmail" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="name@example.com" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" id="loginPassword" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="********" />
                    </div>
                    <button type="submit" class="w-full bg-primary text-white font-bold py-2.5 rounded-xl hover:bg-primaryDark transition mt-2">دخول</button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    ليس لديك حساب؟ <button id="loginToSignup" class="text-primary font-semibold hover:underline">اشترك الآن</button>
                </p>
            </div>
        </section>

        <!-- ========== VIEW: SIGNUP ========== -->
        <section id="viewSignup" class="view-section fade-in">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">إنشاء حساب</h2>
                <p class="text-center text-gray-500 text-sm mb-6">انضم إلينا الآن</p>
                <form id="signupForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">الاسم</label>
                        <input type="text" id="signupName" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="اسمك الكريم" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="signupEmail" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="name@example.com" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" id="signupPassword" required minlength="8" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="أكثر من 8 أحرف" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">تأكيد كلمة المرور</label>
                        <input type="password" id="signupPasswordConfirm" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="أعد كتابة كلمة المرور" />
                    </div>
                    <button type="submit" class="w-full bg-primary text-white font-bold py-2.5 rounded-xl hover:bg-primaryDark transition mt-2">اشتراك</button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    لديك حساب بالفعل؟ <button id="signupToLogin" class="text-primary font-semibold hover:underline">سجل دخولك</button>
                </p>
            </div>
        </section>

        <!-- ========== VIEW: ADMIN CREATE/EDIT MODAL ========== -->
        <div id="adminModal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
            <div class="modal-overlay absolute inset-0" id="adminModalOverlay"></div>
            <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 p-6 z-10 max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-4">
                    <h3 id="adminModalTitle" class="text-xl font-bold text-gray-800">إضافة منتج</h3>
                    <button id="adminModalClose" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
                </div>
                <form id="adminProductForm" class="space-y-4">
                    <input type="hidden" id="adminEditId" value="" />
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">اسم المنتج</label>
                        <input type="text" id="adminName" required class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">السعر</label>
                        <input type="number" id="adminPrice" required min="0" step="0.01" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">الوصف</label>
                        <textarea id="adminDescription" required rows="3" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">القسم</label>
                        <input type="text" id="adminCategory" required class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">المخزون</label>
                        <input type="number" id="adminStock" required min="0" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <button type="submit" id="adminSubmitBtn" class="w-full bg-primary text-white font-bold py-2.5 rounded-xl hover:bg-primaryDark transition">حفظ المنتج</button>
                </form>
            </div>
        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-8 text-center text-gray-500 text-sm">
        <p>&copy; 2026 <span class="text-primary font-semibold">متجرنا</span>. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ============================================================ -->
    <script src="script.js"></script>
</body>
</html>
